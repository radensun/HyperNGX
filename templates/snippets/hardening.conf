# HyperNGX - pengetatan permukaan serangan (per host)

# Blokir metode HTTP yang tidak dipakai.
if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) { return 405; }

# Tolak akses ke berkas sensitif yang tidak sengaja ter-expose upstream.
location ~ /\.(git|svn|hg|env|aws|ssh|htpasswd|htaccess) { deny all; access_log off; return 404; }
location ~* \.(sql|bak|old|swp|log|ini|conf|pem|key)$    { deny all; access_log off; return 404; }

# Batasi koneksi & laju per IP (nilai default; bisa di-override per host).
limit_conn  perip 100;
limit_req   zone=req_general burst=120 nodelay;
