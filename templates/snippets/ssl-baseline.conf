# HyperNGX - baseline TLS (Mozilla "Intermediate" + pengetatan)
# Dipakai di level http{}, di-override per-host bila perlu.

ssl_protocols             TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;                 # TLS1.3: klien yang memilih
ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
ssl_conf_command          Ciphersuites TLS_AES_128_GCM_SHA256:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_256_GCM_SHA384;
ssl_ecdh_curve            X25519:prime256v1:secp384r1;

# Session resumption: 1 MB ~= 4.000 sesi. 100m ~= 400.000 sesi.
ssl_session_cache         shared:HNGX_TLS:100m;
ssl_session_timeout       1d;
ssl_session_tickets       on;
ssl_session_ticket_key    /etc/hyperngx/tls/ticket/current.key;
ssl_session_ticket_key    /etc/hyperngx/tls/ticket/previous.key;   # rotasi 12 jam oleh supervisor

# OCSP stapling: hilangkan round-trip klien ke CA.
ssl_stapling              on;
ssl_stapling_verify       on;
ssl_trusted_certificate   /etc/hyperngx/tls/ca-bundle.pem;
resolver                  127.0.0.1:5353 ipv6=off valid=300s;
resolver_timeout          5s;

# Buffer 4k: TLS record muat dalam 1 paket => TTFB lebih cepat.
ssl_buffer_size           4k;
ssl_early_data            off;   # aktifkan hanya bila upstream anti-replay
