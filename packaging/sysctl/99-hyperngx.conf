# =====================================================================
# HyperNGX - kernel tuning Debian 13 untuk 10.000 concurrent connection
# Pasang di /etc/sysctl.d/99-hyperngx.conf lalu: sysctl --system
# =====================================================================

# --- File descriptor ---
fs.file-max = 2097152
fs.nr_open  = 2097152

# --- Antrian accept & backlog ---
# somaxconn harus >= nilai backlog pada direktif listen nginx.
net.core.somaxconn = 65535
net.core.netdev_max_backlog = 65535
net.ipv4.tcp_max_syn_backlog = 65535
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_synack_retries = 2
net.ipv4.tcp_abort_on_overflow = 0

# --- Buffer socket (autotuning, batas atas 16 MB) ---
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
net.ipv4.tcp_mem  = 786432 1048576 26777216

# --- Manajemen koneksi & TIME_WAIT ---
# Proxy membuka port sumber ke upstream => rentang port lokal diperlebar.
net.ipv4.ip_local_port_range = 10240 65535
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_max_tw_buckets = 1440000
net.ipv4.tcp_slow_start_after_idle = 0

# --- Keepalive: deteksi koneksi mati lebih cepat ---
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 5

# --- Kinerja modern ---
net.ipv4.tcp_fastopen = 3
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_notsent_lowat = 16384

# --- UDP (untuk HTTP/3 / QUIC) ---
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576
net.ipv4.udp_mem = 786432 1048576 26777216

# --- conntrack (bila nftables aktif) ---
net.netfilter.nf_conntrack_max = 1048576
net.netfilter.nf_conntrack_tcp_timeout_established = 3600

# --- Pengetatan jaringan ---
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.all.log_martians = 1
net.ipv6.conf.all.accept_redirects = 0
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.yama.ptrace_scope = 1

# --- Memori ---
vm.swappiness = 10
vm.overcommit_memory = 1
