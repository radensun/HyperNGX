# /etc/hyperngx/nginx/conf.d/admin.conf
# Panel admin. Sengaja di port terpisah supaya bisa difirewall sendiri
# tanpa memutus trafik produksi di 80/443.

upstream hyperngx_api {
    server 127.0.0.1:8081;
    keepalive 8;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name _;

    # Sertifikat self-signed dipasang installer. Ganti dengan sertifikat
    # asli begitu panel punya domain sendiri.
    ssl_certificate     /etc/hyperngx/tls/live/default/fullchain.pem;
    ssl_certificate_key /etc/hyperngx/tls/live/default/privkey.pem;

    include /etc/hyperngx/nginx/snippets/security-headers.conf;

    # Panel tidak boleh diindeks atau dibingkai.
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Batasi siapa yang boleh membuka panel. Ubah sesuai jaringan Anda —
    # idealnya hanya lewat VPN. Baris ini adalah pertahanan paling murah
    # yang tersedia untuk panel admin.
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 192.168.0.0/16;
    deny all;

    client_max_body_size 2m;

    # Login dibatasi terpisah dari sisa API: 5 percobaan per menit di
    # depan rate limit aplikasi yang lebih ketat.
    location = /api/v1/auth/login {
        limit_req zone=req_login burst=3 nodelay;
        proxy_pass http://hyperngx_api;
        include /etc/hyperngx/nginx/snippets/proxy-params.conf;
    }

    location / {
        limit_req zone=req_general burst=40 nodelay;
        proxy_pass http://hyperngx_api;
        include /etc/hyperngx/nginx/snippets/proxy-params.conf;
    }
}
